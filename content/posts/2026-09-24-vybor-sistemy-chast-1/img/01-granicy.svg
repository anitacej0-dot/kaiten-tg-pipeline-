<text x="282.03" y="635.11" textLength="561.92" lengthAdjust="spacing" font-family="Onest" font-size="33" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">: какие процессы и команды должны</text>
