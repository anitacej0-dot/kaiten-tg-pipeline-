<text x="180" y="957.59" textLength="560.95" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Код разработчиков — в Git-репозитории</text>
