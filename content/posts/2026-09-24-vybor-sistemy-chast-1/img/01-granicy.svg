<text x="180" y="1070.89" textLength="754.83" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">В систему достаточно передавать связанные данные:</text>
