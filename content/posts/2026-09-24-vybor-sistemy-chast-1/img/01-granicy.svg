<text x="76" y="456.7" textLength="247.56" lengthAdjust="spacing" font-family="Onest" font-size="32" font-weight="400" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">полей и отчетов.</text>
