<text x="180" y="566.63" textLength="692.63" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Новая редакция — это версия того же файла или</text>
<text x="180" y="603.22" textLength="233.95" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">отдельный файл</text>
<rect x="76" y="655.81" width="928" height="113.19" rx="24" fill="rgb(255, 255, 255)" clip-path="url(#clip1)"/>
<rect x="96" y="681.41" width="62" height="62" rx="31" fill="rgb(125, 76, 207)" clip-path="url(#clip1)"/>
<text x="119.2" y="721.41" textLength="15.58" lengthAdjust="spacing" font-family="Onest" font-size="28" font-weight="700" fill="rgb(255, 255, 255)" xml:space="preserve" clip-path="url(#clip1)">3</text>
<text x="180" y="703.81" textLength="742.58" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Права на отдельный документ, а не только на задачу</text>
<text x="180" y="740.41" textLength="117.58" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">целиком</text>
<rect x="76" y="793" width="928" height="113.19" rx="24" fill="rgb(255, 255, 255)" clip-path="url(#clip1)"/>
<rect x="96" y="818.59" width="62" height="62" rx="31" fill="rgb(125, 76, 207)" clip-path="url(#clip1)"/>
<text x="119.2" y="858.59" textLength="15.58" lengthAdjust="spacing" font-family="Onest" font-size="28" font-weight="700" fill="rgb(255, 255, 255)" xml:space="preserve" clip-path="url(#clip1)">4</text>
<text x="180" y="841" textLength="684.84" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Поиск по содержимому страницы, а не только по</text>
<text x="180" y="877.59" textLength="158.31" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">заголовкам</text>
<rect x="76" y="930.19" width="928" height="102" rx="24" fill="rgb(255, 255, 255)" clip-path="url(#clip1)"/>
<rect x="96" y="950.19" width="62" height="62" rx="31" fill="rgb(125, 76, 207)" clip-path="url(#clip1)"/>
<text x="119.2" y="990.19" textLength="15.58" lengthAdjust="spacing" font-family="Onest" font-size="28" font-weight="700" fill="rgb(255, 255, 255)" xml:space="preserve" clip-path="url(#clip1)">5</text>
<text x="180" y="990.89" textLength="750.64" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Публичный доступ к странице, разделу или всей базе</text>
<text x="76" y="1229.09" textLength="887.19" lengthAdjust="spacing" font-family="Onest" font-size="32" font-weight="700" fill="rgb(125, 76, 207)" xml:space="preserve" clip-path="url(#clip1)">Проверьте и то, что будет со ссылками после переноса</text>
<text x="76" y="1270.05" textLength="167.52" lengthAdjust="spacing" font-family="Onest" font-size="32" font-weight="700" fill="rgb(125, 76, 207)" xml:space="preserve" clip-path="url(#clip1)">документа</text>
</svg>