<text x="76" y="180" textLength="371.55" lengthAdjust="spacing" font-family="Raleway" font-size="68" font-weight="700" letter-spacing="-1.2" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Документы</text>
<text x="465.23" y="180" textLength="452.73" lengthAdjust="spacing" font-family="Raleway" font-size="68" font-weight="700" letter-spacing="-1.2" fill="rgb(125, 76, 207)" xml:space="preserve" clip-path="url(#clip1)">и база знаний</text>
<text x="76" y="254.08" textLength="822.42" lengthAdjust="spacing" font-family="Onest" font-size="32" font-weight="400" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Договор достаточно приложить к задаче. А инструкцию</text>
<text x="76" y="297.59" textLength="781.81" lengthAdjust="spacing" font-family="Onest" font-size="32" font-weight="400" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">сотрудник должен найти через полгода, не помня ни</text>
<text x="76" y="341.11" textLength="329.28" lengthAdjust="spacing" font-family="Onest" font-size="32" font-weight="400" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">названия, ни раздела.</text>
