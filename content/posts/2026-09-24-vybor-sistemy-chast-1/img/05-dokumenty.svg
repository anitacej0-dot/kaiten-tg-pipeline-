<text x="180" y="453.33" textLength="774.55" lengthAdjust="spacing" font-family="Onest" font-size="30" font-weight="500" fill="rgb(69, 63, 77)" xml:space="preserve" clip-path="url(#clip1)">Входят ли прежние версии файлов в лимит хранилища</text>
<rect x="76" y="518.63" width="928" height="113.19" rx="24" fill="rgb(255, 255, 255)" clip-path="url(#clip1)"/>
